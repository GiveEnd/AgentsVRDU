services:

  document-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-agent

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./app:/app/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - document-network


  open-webui:
    image: ghcr.io/open-webui/open-webui:main

    container_name: open-webui

    restart: unless-stopped

    ports:
      - "3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    environment:
      - WEBUI_AUTH=True

    networks:
      - document-network


volumes:
  open-webui-data:


networks:
  document-network:
    driver: bridge